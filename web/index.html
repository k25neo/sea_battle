<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Морской бой</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>⚓ Морской бой</h1>

  <!-- Экран меню -->
  <section id="screen-menu" class="screen">
    <div class="panel">
      <label>Ваше имя:
        <input id="name-input" maxlength="16" placeholder="Игрок">
      </label>
      <div class="row">
        <button id="btn-find" class="primary">🔍 Найти бой</button>
      </div>
      <div class="row">
        <button id="btn-create">Создать комнату с кодом</button>
      </div>
      <div class="row">
        <input id="join-code" maxlength="5" placeholder="Код комнаты" autocomplete="off">
        <button id="btn-join">Присоединиться</button>
      </div>
      <div id="menu-rooms" class="menu-rooms hidden">
        <div class="or-title">⏳ Ждут соперника — присоединяйся:</div>
        <div id="menu-rooms-list"></div>
      </div>
      <p id="stats-line" class="stats-line"></p>
    </div>
  </section>

  <!-- Экран расстановки -->
  <section id="screen-placement" class="screen hidden">
    <div class="status">
      Комната: <b id="room-code"></b> · <span id="placement-status">Ожидание второго игрока…</span>
    </div>
    <div class="boards">
      <div>
        <h3>Ваше поле</h3>
        <div id="place-board" class="board"></div>
      </div>
      <div class="panel side">
        <div class="invite">
          <input id="invite-link" readonly title="Ссылка для соперника">
          <div class="row">
            <button id="btn-copy">Копировать</button>
            <button id="btn-share" class="primary hidden">Поделиться</button>
          </div>
        </div>
        <div id="open-rooms" class="open-rooms hidden">
          <div class="or-title">Свободные комнаты — можно войти:</div>
          <div id="open-rooms-list"></div>
        </div>
        <div id="fleet-left" class="fleet-left"></div>
        <div class="row">
          <button id="btn-rotate">Повернуть (R)</button>
          <button id="btn-random">Случайно</button>
        </div>
        <div class="row">
          <button id="btn-clear">Очистить</button>
        </div>
        <div class="row">
          <button id="btn-ready" class="primary" disabled>В бой!</button>
        </div>
        <p class="hint">Клик — поставить корабль, клик по кораблю — убрать</p>
      </div>
    </div>
  </section>

  <!-- Экран боя -->
  <section id="screen-battle" class="screen hidden">
    <div class="status" id="battle-status">…</div>
    <div class="boards">
      <div>
        <h3>Ваше поле <span class="opp" id="opp-name-own"></span></h3>
        <div id="my-board" class="board"></div>
      </div>
      <div>
        <h3>Поле противника <span class="opp" id="opp-name-enemy"></span></h3>
        <div id="enemy-board" class="board clickable"></div>
      </div>
    </div>
    <div class="chat">
      <div id="chat-box" class="chat-box"></div>
      <div class="chat-input-row">
        <input id="chat-input" maxlength="300" placeholder="Написать сопернику…" autocomplete="off">
        <button id="btn-send">➤</button>
      </div>
    </div>
  </section>

  <!-- Финал -->
  <div id="overlay" class="overlay hidden">
    <div class="panel">
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <button id="btn-again" class="primary">В главное меню</button>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- VK Mini Apps: мост; вне ВК скрипт безвреден -->
  <script src="https://vk.com/js/api/vk_bridge_api.js" onerror="window.__vkScriptFailed = 1"></script>
  <script src="app.js"></script>
</body>
</html>
